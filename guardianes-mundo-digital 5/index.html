<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2e33" />
    <meta name="description" content="Guardianes del Mundo Digital: La Fortaleza de los Secretos. Una aventura educativa sobre seguridad digital para niñas y niños de 10 a 12 años. Iniciativa Naveguemos Seguros." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Guardianes del Mundo Digital</title>
  </head>
  <body>
    <main id="app" aria-label="Videojuego Guardianes del Mundo Digital">
      <div id="game"></div>
      <div id="loading" role="status" aria-live="polite">
        <div class="loading-crystal" aria-hidden="true"></div>
        <p>Cargando Conexia…</p>
      </div>
      <div id="rotate" role="alert">
        <div class="rotate-phone" aria-hidden="true"></div>
        <p>Gira tu dispositivo para jugar en horizontal</p>
      </div>
      <noscript>Este juego necesita JavaScript activado para funcionar.</noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
